<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Mic Assignment</title>


  <style>

    :root {
      --bg: #06090f;
      --panel: #0f141c;
      --text: #f5f7fa;
      --accent: #8ed8ff;
      --muted: rgba(255,255,255,0.72);

      --green: #31d17c;
      --yellow: #ffd166;
      --red: #ff5d73;
      --offline: #8b96a3;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {
      min-height: 100%;
      margin: 0;
      padding: 0;

      font-family: Arial, sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at top center,
          rgba(0,130,255,0.16),
          transparent 35%
        ),
        linear-gradient(
          180deg,
          #07101a 0%,
          #04070c 100%
        );
    }


    body {
      display: flex;
      flex-direction: column;
    }


    /* ========================================
       MAIN LAYOUT
    ======================================== */


    .main-layout {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr) 365px;

      gap: 12px;

      padding: 12px 24px 24px;

      min-height: 100vh;

    }


    .left-side {

      min-width: 0;

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    /* ========================================
       MIC BOARD
    ======================================== */


    .board-shell {

      flex: 1;

      min-height: 460px;

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.03),
          rgba(255,255,255,0.01)
        ),
        rgba(0,0,0,0.4);

      border:
        1px solid rgba(255,255,255,0.06);

      border-radius: 12px;

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.02),
        0 20px 60px rgba(0,0,0,0.45);

      padding: 12px;

      overflow-x: auto;

      display: flex;

    }


    .mic-container {

      flex: 1;

      min-height: 0;

      display: grid;

      grid-auto-flow: column;

      grid-auto-columns:
        minmax(135px, 1fr);

      gap: 2px;

      width: 100%;

      min-width: max-content;

      background:
        rgba(255,255,255,0.03);

    }


    .mic-card {

      position: relative;

      width: 100%;

      min-width: 135px;

      height: 100%;

      min-height: 430px;

      overflow: hidden;

      display: flex;

      flex-direction: column;

      justify-content: space-between;

      border-left:
        1px solid rgba(255,255,255,0.04);

      border-right:
        1px solid rgba(0,0,0,0.45);

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.03),
          rgba(0,0,0,0.12)
        ),
        var(--panel);

    }


    .mic-card::before {

      content: "";

      position: absolute;

      inset: 0;

      z-index: 1;

      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.15) 0%,
          rgba(0,0,0,0.06) 22%,
          rgba(0,0,0,0.20) 64%,
          rgba(0,0,0,0.74) 100%
        );

    }


    .mic-card.has-photo {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }


    .mic-card.no-photo {

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.03),
          rgba(255,255,255,0.01)
        ),
        linear-gradient(
          180deg,
          #49525f 0%,
          #313947 100%
        );

    }


    .mic-card.backup {

      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,0.05),
          rgba(255,255,255,0.02)
        ),
        linear-gradient(
          180deg,
          #8fdcff 0%,
          #71c9f2 100%
        );

    }


    .mic-card.backup::before {

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.10) 0%,
          rgba(0,0,0,0.04) 35%,
          rgba(0,0,0,0.38) 100%
        );

    }


    .mic-inner {

      position: relative;

      z-index: 2;

      height: 100%;

      display: flex;

      flex-direction: column;

    }


    .mic-middle {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding:
        18px 10px 12px;

    }


    .name-stack {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 8px;

      width: 100%;

    }


    .mic-name {

      margin: 0;

      font-size:
        clamp(1.35rem, 2.1vw, 2.45rem);

      font-weight: 900;

      line-height: 1.04;

      color: #fff;

      text-shadow:
        0 4px 12px rgba(0,0,0,0.65),
        0 8px 28px rgba(0,0,0,0.85);

      overflow-wrap: break-word;

    }


    .mic-number {

      margin-top: 3px;

      font-size:
        clamp(1.2rem, 1.55vw, 1.8rem);

      font-weight: 900;

      color: #fff;

      letter-spacing:
        0.02em;

      text-shadow:
        0 2px 3px rgba(0,0,0,1),
        0 4px 10px rgba(0,0,0,0.95),
        0 8px 24px rgba(0,0,0,0.9),
        0 0 18px rgba(0,0,0,0.8);

    }


    .meta-stack {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 6px;

      margin-top: 5px;

    }


    .meta-line {

      margin: 0;

      font-size:
        clamp(0.9rem, 1.1vw, 1.18rem);

      font-weight: 800;

      text-align: center;

      line-height: 1.2;

      color: #fff;

      text-shadow:
        0 2px 6px rgba(0,0,0,0.5),
        0 4px 14px rgba(0,0,0,0.6);

    }


    .meta-label {

      color: var(--accent);

      margin-right: 6px;

      font-weight: 900;

    }


    /* ========================================
       BATTERY
    ======================================== */


    .battery-strip {

      margin:
        0 8px 8px;

      padding:
        8px 9px;

      border-radius: 9px;

      background:
        rgba(0,0,0,0.55);

      border:
        1px solid rgba(255,255,255,0.10);

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 6px;

      font-size: 0.73rem;

      font-weight: 900;

      text-transform: uppercase;

      letter-spacing: 0.035em;

      backdrop-filter:
        blur(5px);

    }


    .battery-left {

      display: flex;

      align-items: center;

      gap: 7px;

      min-width: 0;

    }


    .battery-icon {

      width: 25px;

      height: 12px;

      border:
        2px solid currentColor;

      border-radius: 3px;

      padding: 1px;

      position: relative;

      flex-shrink: 0;

    }


    .battery-icon::after {

      content: "";

      position: absolute;

      width: 3px;

      height: 6px;

      right: -5px;

      top: 1px;

      border-radius:
        0 2px 2px 0;

      background:
        currentColor;

    }


    .battery-fill {

      height: 100%;

      border-radius: 1px;

      background: currentColor;

    }


    .battery-status.live.good {
      color: var(--green);
    }


    .battery-status.live.warn {
      color: var(--yellow);
    }


    .battery-status.live.low {
      color: var(--red);
    }


    .battery-status.offline {
      color: var(--offline);
    }


    .battery-status.unknown {

      color: var(--offline);

      opacity: 0.8;

    }


    /* ========================================
       UTILITY
    ======================================== */


    .utility-wrap {

      padding: 12px;

      border:
        1px solid rgba(255,255,255,0.07);

      background:
        rgba(0,0,0,0.31);

      border-radius: 12px;

    }


    .utility-heading {

      display: flex;

      align-items: center;

      margin-bottom: 9px;

    }


    .utility-heading h2 {

      margin: 0;

      font-size: 0.9rem;

      letter-spacing: 0.08em;

      text-transform: uppercase;

    }


    .utility-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(145px, 1fr));

      gap: 8px;

    }


    .utility-card {

      border:
        1px solid rgba(255,255,255,0.08);

      background:
        rgba(255,255,255,0.035);

      border-radius: 9px;

      padding: 10px;

    }


    .utility-name {

      font-weight: 900;

      font-size: 0.93rem;

    }


    .utility-type {

      margin-top: 2px;

      color: var(--muted);

      font-size: 0.73rem;

      text-transform: uppercase;

      letter-spacing: 0.07em;

    }


    .utility-card .battery-strip {

      margin:
        8px 0 0;

    }


    /* ========================================
       ORDER OF SERVICE
    ======================================== */


    .order-panel {

      background:
        rgba(0,0,0,0.38);

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 14px;

      padding: 16px;

      overflow-y: auto;

      max-height:
        calc(100vh - 24px);

    }


    .plan-leaders {

      margin-bottom: 14px;

      padding-bottom: 12px;

      border-bottom:
        1px solid rgba(255,255,255,0.08);

    }


    .plan-leaders-label {

      color: var(--muted);

      font-size: 0.68rem;

      font-weight: 800;

      letter-spacing: 0.09em;

      text-transform: uppercase;

      margin-bottom: 4px;

    }


    .plan-leaders-value {

      color: #fff;

      font-size: 0.91rem;

      font-weight: 800;

      line-height: 1.35;

    }


    .order-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      padding-bottom: 11px;

      margin-bottom: 8px;

      border-bottom:
        1px solid rgba(255,255,255,0.10);

    }


    .order-label {

      color: var(--accent);

      font-size: 0.83rem;

      font-weight: 900;

      letter-spacing: 0.12em;

      text-transform: uppercase;

    }


    .order-date {

      color: var(--muted);

      font-size: 0.73rem;

      font-weight: 750;

      text-align: right;

      white-space: nowrap;

    }


    .order-list {

      display: flex;

      flex-direction: column;

      gap: 5px;

    }


    .order-section-header {

      margin-top: 14px;

      margin-bottom: 3px;

      padding:
        8px 4px 6px;

      color: var(--accent);

      font-size: 0.76rem;

      font-weight: 900;

      letter-spacing: 0.11em;

      text-transform: uppercase;

      border-bottom:
        1px solid rgba(142,216,255,0.25);

    }


    .order-section-header:first-child {
      margin-top: 0;
    }


    .order-item {

      display: grid;

      grid-template-columns:
        22px minmax(0, 1fr) auto;

      gap: 9px;

      align-items: start;

      padding:
        9px 9px;

      border-radius: 8px;

      background:
        rgba(255,255,255,0.035);

      border:
        1px solid rgba(255,255,255,0.055);

      font-size: 0.84rem;

    }


    .order-item.song {

      background:
        rgba(142,216,255,0.09);

      border-color:
        rgba(142,216,255,0.16);

    }


    .order-number {

      color:
        rgba(255,255,255,0.40);

      font-size: 0.70rem;

      font-weight: 800;

      padding-top: 2px;

    }


    .order-item-content {
      min-width: 0;
    }


    .order-title-text {

      color: #fff;

      font-weight: 850;

      line-height: 1.2;

    }


    .order-item.song .order-title-text {
      color: #dff5ff;
    }


    .order-key {

      margin-top: 5px;

      color: var(--accent);

      font-size: 0.69rem;

      font-weight: 900;

    }


    .order-description {

      margin-top: 4px;

      color: var(--muted);

      font-size: 0.69rem;

      line-height: 1.35;

      font-weight: 600;

    }


    .order-item-leader {

      min-width: 70px;

      max-width: 105px;

      text-align: right;

      color:
        rgba(255,255,255,0.82);

      font-size: 0.67rem;

      font-weight: 800;

      line-height: 1.25;

      align-self: center;

    }


    .order-item-leader-label {

      display: block;

      color:
        rgba(255,255,255,0.40);

      font-size: 0.58rem;

      letter-spacing: 0.06em;

      text-transform: uppercase;

      margin-bottom: 2px;

    }


    .planning-empty {

      color: var(--muted);

      font-size: 0.86rem;

      padding:
        8px 3px;

    }


    /* ========================================
       RESPONSIVE
    ======================================== */


    @media (max-width: 900px) {

      .main-layout {

        grid-template-columns:
          1fr;

        padding:
          12px 16px;

      }


      .order-panel {
        max-height: none;
      }


      .utility-grid {

        grid-template-columns:
          repeat(2, minmax(140px, 1fr));

      }

    }


    @media (max-width: 640px) {

      .utility-grid {

        grid-template-columns:
          1fr 1fr;

      }


      .order-item {

        grid-template-columns:
          20px minmax(0, 1fr) auto;

      }

    }

  </style>

</head>


<body>


  <div class="main-layout">


    <div class="left-side">


      <div class="board-shell">

        <div
          class="mic-container"
          id="micBoard"
        ></div>

      </div>


      <div class="utility-wrap">

        <div class="utility-heading">

          <h2>
            Utility Wireless
          </h2>

        </div>


        <div
          class="utility-grid"
          id="utilityGrid"
        ></div>

      </div>


    </div>


    <aside class="order-panel">


      <div
        class="plan-leaders"
        id="planLeadersWrap"
      >

        <div class="plan-leaders-label">
          Scheduled Audio:
        </div>

        <div
          class="plan-leaders-value"
          id="planLeaders"
        >
          --
        </div>

      </div>


      <div class="order-header">

        <div class="order-label">
          Order of Service
        </div>

        <div
          class="order-date"
          id="orderDate"
        ></div>

      </div>


      <div
        class="order-list"
        id="orderOfService"
      ></div>


    </aside>


  </div>


  <script type="module">


    import {

      initializeApp

    }
    from
    "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";


    import {

      getFirestore,
      getDocs,
      collection,
      onSnapshot,
      doc

    }
    from
    "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyBvx4480OFZ1hSkgLsqe4KO7bAWny-kG_U",

      authDomain:
        "micassignments.firebaseapp.com",

      projectId:
        "micassignments",

      storageBucket:
        "micassignments.appspot.com",

      messagingSenderId:
        "1010248680745",

      appId:
        "1:1010248680745:web:b82c69767cc857269c2338"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getFirestore(
        app
      );


    const micBoard =
      document.getElementById(
        "micBoard"
      );


    const utilityGrid =
      document.getElementById(
        "utilityGrid"
      );


    const orderEl =
      document.getElementById(
        "orderOfService"
      );


    const orderDate =
      document.getElementById(
        "orderDate"
      );


    const planLeaders =
      document.getElementById(
        "planLeaders"
      );


    const planLeadersWrap =
      document.getElementById(
        "planLeadersWrap"
      );


    const docOrder = [

      "one",
      "two",
      "three",
      "four",
      "five",
      "six",
      "seven",
      "eight",
      "nine"

    ];


    const utilityOrder = [

      "utility1",
      "utility2",
      "utility3",
      "utility4"

    ];


    let cachedPhotos = {};

    let micData = {};

    let wirelessStatus = {};


    function escapeHtml(
      str = ""
    ) {

      return String(str)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function niceTime(
      value
    ) {

      if (!value)
        return "";


      const d =

        value?.toDate

          ? value.toDate()

          : new Date(value);


      if (
        Number.isNaN(
          d.getTime()
        )
      ) {

        return "";

      }


      return d.toLocaleTimeString(

        [],

        {

          hour:
            "numeric",

          minute:
            "2-digit"

        }

      );

    }


    function niceDate(
      value
    ) {

      if (!value)
        return "";


      const d =
        new Date(value);


      if (
        Number.isNaN(
          d.getTime()
        )
      ) {

        return "";

      }


      return d.toLocaleDateString(

        [],

        {

          month:
            "short",

          day:
            "numeric"

        }

      );

    }


    function batteryClass(
      status
    ) {

      if (
        !status ||
        status.bars === null ||
        status.bars === undefined
      ) {

        return "unknown";

      }


      if (!status.online)
        return "offline";


      if (
        Number(status.bars) <= 1
      )
        return "live low";


      if (
        Number(status.bars) <= 3
      )
        return "live warn";


      return "live good";

    }


    function batteryHtml(
      status
    ) {

      if (
        !status ||
        status.bars === null ||
        status.bars === undefined
      ) {

        return `

          <div
            class="battery-strip battery-status unknown"
          >

            <div class="battery-left">

              <div class="battery-icon">

                <div
                  class="battery-fill"
                  style="width:0%"
                ></div>

              </div>

              <span>
                Battery --
              </span>

            </div>

            <span>
              Unknown
            </span>

          </div>

        `;

      }


      const bars =

        Math.max(
          0,
          Math.min(
            5,
            Number(status.bars)
          )
        );


      const pct =
        bars * 20;


      const cls =
        batteryClass(status);


      const last =
        niceTime(
          status.lastSeen ||
          status.updatedAt
        );


      if (
        status.online
      ) {

        const label =

          status.chargePercent !== null &&
          status.chargePercent !== undefined

            ? `${status.chargePercent}%`

            : `${bars}/5`;


        return `

          <div
            class="battery-strip battery-status ${cls}"
          >

            <div class="battery-left">

              <div class="battery-icon">

                <div
                  class="battery-fill"
                  style="width:${pct}%"
                ></div>

              </div>

              <span>
                ${escapeHtml(label)}
              </span>

            </div>

            <span>
              Live
            </span>

          </div>

        `;

      }


      return `

        <div
          class="battery-strip battery-status ${cls}"
        >

          <div class="battery-left">

            <div class="battery-icon">

              <div
                class="battery-fill"
                style="width:${pct}%"
              ></div>

            </div>

            <span>
              Last ${bars}/5
            </span>

          </div>

          <span>

            ${
              last

                ? `Off • ${escapeHtml(last)}`

                : "Offline"
            }

          </span>

        </div>

      `;

    }


    /* ========================================
       PLANNING CENTER
    ======================================== */


    onSnapshot(

      doc(
        db,
        "planningCenter",
        "current"
      ),

      docSnap => {


        const data =
          docSnap.data();


        if (
          !data
        ) {

          planLeadersWrap.style.display =
            "none";

          orderDate.textContent =
            "";

          orderEl.innerHTML = `

            <div class="planning-empty">
              No service order loaded.
            </div>

          `;

          return;

        }


        const overallLeaders =

          Array.isArray(
            data.leaders
          )

            ? data.leaders

            : [];


        if (
          overallLeaders.length
        ) {

          planLeadersWrap.style.display =
            "";


planLeaders.textContent =

  overallLeaders

    .map(
      leader =>
        leader.name || ""
    )

    .filter(Boolean)

    .join(", ");

        }

        else {

          planLeadersWrap.style.display =
            "none";

        }


        orderDate.textContent =
          niceDate(
            data.planDate
          );


        const order =

          Array.isArray(
            data.orderOfService
          )

            ? data.orderOfService

            : [];


        if (
          !order.length
        ) {

          orderEl.innerHTML = `

            <div class="planning-empty">
              No service order loaded.
            </div>

          `;

          return;

        }


        let visibleItemNumber =
          0;


        orderEl.innerHTML =

          order

            .map(

              item => {


                if (
                  item.isHeader
                ) {

                  return `

                    <div class="order-section-header">

                      ${escapeHtml(
                        item.title ||
                        ""
                      )}

                    </div>

                  `;

                }


                visibleItemNumber++;


                const itemLeaders =

                  Array.isArray(
                    item.leaders
                  )

                    ? item.leaders

                    : [];


                return `

                  <div
                    class="order-item ${item.isSong ? "song" : ""}"
                  >


                    <div class="order-number">

                      ${visibleItemNumber}

                    </div>


                    <div class="order-item-content">


                      <div class="order-title-text">

                        ${escapeHtml(
                          item.title ||
                          ""
                        )}

                      </div>


                      ${
                        item.isSong &&
                        item.key

                          ? `

                            <div class="order-key">

                              Key:
                              ${escapeHtml(
                                item.key
                              )}

                            </div>

                          `

                          : ""
                      }


                      ${
                        item.description

                          ? `

                            <div class="order-description">

                              ${escapeHtml(
                                item.description
                              )}

                            </div>

                          `

                          : ""
                      }


                    </div>


${
  itemLeaders.length

    ? `

      <div class="order-item-leader">

        ${
          item.isSong

            ? `

              <span class="order-item-leader-label">
                Leader
              </span>

            `

            : ""
        }

        ${escapeHtml(
          itemLeaders.join(", ")
        )}

      </div>

    `

    : `

      <div></div>

    `
}


                  </div>

                `;

              }

            )

            .join("");

      }

    );


    /* ========================================
       PHOTOS
    ======================================== */


    async function loadImages() {

      const snapshot =

        await getDocs(

          collection(
            db,
            "images"
          )

        );


      snapshot.forEach(

        d => {

          const data =
            d.data();


          if (
            data.name
          ) {

            cachedPhotos[
              data.name
            ] =
              data.photoURL || "";

          }

        }

      );

    }


    /* ========================================
       MIC BOARD
    ======================================== */


    function renderMicBoard() {

      micBoard.innerHTML =
        "";


      docOrder.forEach(

        docId => {

          const data =
            micData[docId];


          if (
            !data ||
            data.name === "No One"
          )
            return;


          const micCard =

            document.createElement(
              "div"
            );


          const photoUrl =

            cachedPhotos[
              data.name
            ]

            ||

            "";


          const hasPhoto =
            !!photoUrl;


          const lowerName =

            String(
              data.name || ""
            )
            .toLowerCase();


          const lowerPosition =

            String(
              data.position || ""
            )
            .toLowerCase();


          const isBackup =

            lowerName.includes(
              "backup"
            )

            ||

            lowerName.includes(
              "announcement"
            )

            ||

            lowerPosition.includes(
              "backup"
            )

            ||

            lowerPosition.includes(
              "announcement"
            );


          micCard.classList.add(

            "mic-card",

            hasPhoto

              ? "has-photo"

              : "no-photo"

          );


          if (
            isBackup
          )
            micCard.classList.add(
              "backup"
            );


          if (
            hasPhoto
          ) {

            micCard.style.backgroundImage =
              `url("${photoUrl}")`;

          }


          micCard.innerHTML = `

            <div class="mic-inner">


              <div class="mic-middle">

                <div class="name-stack">


                  <h3 class="mic-name">

                    ${escapeHtml(
                      data.name ||
                      "Unassigned"
                    )}

                  </h3>


                  <div class="mic-number">

                    ${escapeHtml(

                      data.micNumber

                        ? `Mic: ${data.micNumber}`

                        : "Mic: --"

                    )}

                  </div>


                  ${
                    data.inEarPack ||
                    data.position

                      ? `

                        <div class="meta-stack">

                          ${
                            data.inEarPack

                              ? `

                                <p class="meta-line">

                                  <span class="meta-label">
                                    In Ear:
                                  </span>

                                  ${escapeHtml(
                                    data.inEarPack
                                  )}

                                </p>

                              `

                              : ""
                          }


                          ${
                            data.position

                              ? `

                                <p class="meta-line">

                                  <span class="meta-label">
                                    Position:
                                  </span>

                                  ${escapeHtml(
                                    data.position
                                  )}

                                </p>

                              `

                              : ""
                          }

                        </div>

                      `

                      : ""
                  }


                </div>

              </div>


              ${batteryHtml(
                wirelessStatus[docId]
              )}


            </div>

          `;


          micBoard.appendChild(
            micCard
          );

        }

      );

    }


    /* ========================================
       UTILITY RECEIVERS
    ======================================== */


    function renderUtility() {

      utilityGrid.innerHTML =
        "";


      utilityOrder.forEach(

        id => {

          const cfg =

            wirelessStatus[id]

            ||

            {};


          const card =

            document.createElement(
              "div"
            );


          card.className =
            "utility-card";


          card.innerHTML = `

            <div class="utility-name">

              ${escapeHtml(

                cfg.label

                ||

                id.replace(
                  "utility",
                  "Utility "
                )

              )}

            </div>


            <div class="utility-type">

              ${escapeHtml(
                cfg.type ||
                "Wireless"
              )}

            </div>


            ${batteryHtml(cfg)}

          `;


          utilityGrid.appendChild(
            card
          );

        }

      );

    }


    /* ========================================
       INITIALIZE
    ======================================== */


    await loadImages();


    docOrder.forEach(

      docId => {

        onSnapshot(

          doc(
            db,
            "micAssignments",
            docId
          ),

          docSnap => {

            micData[docId] =

              docSnap.data()

              ||

              null;


            renderMicBoard();

          }

        );

      }

    );


    [

      ...docOrder,
      ...utilityOrder

    ].forEach(

      id => {

        onSnapshot(

          doc(
            db,
            "wirelessStatus",
            id
          ),

          docSnap => {

            wirelessStatus[id] =

              docSnap.data()

              ||

              {};


            renderMicBoard();

            renderUtility();

          }

        );

      }

    );


    renderMicBoard();

    renderUtility();


  </script>

</body>

</html>
